---
# analytics_starrocks_be role -- install JDK + StarRocks BE from the release
# tarball, the systemd unit (DISABLED -- the Terraform be-join overlay renders
# be.conf + joins the BE via ALTER SYSTEM ADD BACKEND on the FE leader then
# enables it), and the per-node dirs.

# ─── JDK (BE tooling/agent expects Java available) ───────────────────────
- name: Install JDK for StarRocks BE tooling
  ansible.builtin.apt:
    name: "{{ analytics_jdk_package }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── StarRocks system account ────────────────────────────────────────────
- name: Create starrocks group
  ansible.builtin.group:
    name: "{{ analytics_sr_group }}"
    system: true

- name: Create starrocks user
  ansible.builtin.user:
    name: "{{ analytics_sr_user }}"
    group: "{{ analytics_sr_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ analytics_sr_home }}"
    create_home: false

# ─── Download + unpack the StarRocks release tarball ─────────────────────
- name: Download StarRocks release tarball
  ansible.builtin.get_url:
    url: "{{ analytics_starrocks_download_url }}"
    dest: "/tmp/starrocks-{{ analytics_starrocks_version }}.tar.gz"
    mode: "0644"
    timeout: 120

- name: Create install root
  ansible.builtin.file:
    path: "{{ analytics_sr_home }}"
    state: directory
    owner: "{{ analytics_sr_user }}"
    group: "{{ analytics_sr_group }}"
    mode: "0755"

- name: Unpack StarRocks (strip the top-level StarRocks-<ver> dir)
  ansible.builtin.unarchive:
    src: "/tmp/starrocks-{{ analytics_starrocks_version }}.tar.gz"
    dest: "{{ analytics_sr_home }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: "{{ analytics_sr_user }}"
    group: "{{ analytics_sr_group }}"
    creates: "{{ analytics_sr_home }}/be/bin/start_be.sh"

- name: Remove the tarball
  ansible.builtin.file:
    path: "/tmp/starrocks-{{ analytics_starrocks_version }}.tar.gz"
    state: absent

# ─── Per-node dirs ────────────────────────────────────────────────────────
- name: Create per-node BE directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ analytics_sr_home }}/be/storage", owner: "{{ analytics_sr_user }}", group: "{{ analytics_sr_group }}", mode: "0750" }
    - { path: "{{ analytics_sr_home }}/be/conf/tls", owner: "{{ analytics_sr_user }}", group: "{{ analytics_sr_group }}", mode: "0750" }
    - { path: "{{ analytics_sr_identity_dir }}", owner: root, group: "{{ analytics_sr_group }}", mode: "0750" }
    - { path: "{{ analytics_backup_mount }}", owner: "{{ analytics_sr_user }}", group: "{{ analytics_sr_group }}", mode: "0750" }

# ─── nexus-starrocks-be.service (DISABLED at bake) ───────────────────────
- name: Install nexus-starrocks-be.service systemd unit
  ansible.builtin.template:
    src: nexus-starrocks-be.service.j2
    dest: /etc/systemd/system/nexus-starrocks-be.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure nexus-starrocks-be.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-starrocks-be.service
    enabled: false
    daemon_reload: true

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify BE binary present
  ansible.builtin.command: "test -x {{ analytics_sr_home }}/be/bin/start_be.sh"
  changed_when: false

- name: Show StarRocks BE install summary
  ansible.builtin.debug:
    msg: "StarRocks BE: {{ analytics_sr_home }}/be (version {{ analytics_starrocks_version }})"
