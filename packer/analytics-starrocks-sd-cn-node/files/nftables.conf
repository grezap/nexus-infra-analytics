#!/usr/sbin/nft -f
#
# analytics-starrocks-be-node -- nftables ruleset (Phase 0.G.6 baseline;
# cold-clone safety net). The TF role-overlay-starrocks-nftables-backplane.tf
# is the canonical source of truth.
#
# nic0 = VMnet11 (service: BE webserver 8040 for ops), nic1 = VMnet10
# (backplane: BE thrift 9060 + heartbeat 9050 + brpc 8060 + FE<->BE). Per
# memory/feedback_cluster_template_nftables_backplane.md the VMnet10 trust rule
# is what makes the tablet plane + FE<->BE traffic work.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane (BE thrift 9060 + heartbeat 9050 +
        # brpc 8060 + FE<->BE). Whole-segment trust is canonical.
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Operator access from the lab (VMnet11):
        #   8040  StarRocks BE webserver (per-BE status / metrics)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 8040 accept comment "StarRocks BE webserver from VMnet11"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
