#!/usr/sbin/nft -f
#
# analytics-clickhouse-server-node -- nftables ruleset (Phase 0.G.5 baseline;
# cold-clone safety net).
#
# Builds on the deb13 baseline (deny-all-inbound, allow SSH + node_exporter
# from VMnet11) and adds the ClickHouse data-node role's cluster-backplane +
# operator-access rules.
#
# At clone time nic0 = VMnet11 (service), nic1 = VMnet10 (cluster backplane),
# set up by analytics-node-firstboot.sh post-clone.
#
# Kept in sync with terraform/envs/analytics-clickhouse/role-overlay-clickhouse-
# nftables-backplane.tf (the canonical source of truth). This baked baseline
# only matters for a clone whose Terraform apply never ran.
#
# Per memory/feedback_cluster_template_nftables_backplane.md: the
# `iifname "nic1" ip saddr 192.168.10.0/24 accept` rule is what makes inter-
# server replication (9010), native cluster traffic (9440), and Keeper client
# traffic (to 9181) work over the backplane; without it ping passes but TCP
# does not.
#
# ClickHouse is configured mTLS-only (ADR-0029): plain ports 8123/9000/9009 are
# disabled in config; the secure ports are 8443 (HTTPS), 9440 (native TLS), 9010
# (interserver HTTPS).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop

        # ICMP -- let everything ping (debug-friendly in a lab)
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        # Management from the lab network only
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane: inter-server replication fetch
        # (9010 HTTPS), native distributed query fan-out (9440 TLS), and the
        # data node's outbound Keeper client traffic. Whole-segment trust is
        # the canonical cluster-backplane pattern; nic1 only carries
        # 192.168.10.0/24, and the saddr restriction prevents cross-network leak.
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Operator / app / smoke-gate access from the build host / lab (VMnet11):
        #   8443  ClickHouse HTTPS
        #   9440  ClickHouse native protocol over TLS (clickhouse-client --secure)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport { 8443, 9440 } accept comment "ClickHouse HTTPS + native-TLS from VMnet11"

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
