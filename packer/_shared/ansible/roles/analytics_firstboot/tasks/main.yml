---
# analytics_firstboot -- shared role that installs the analytics-tier firstboot
# script + systemd unit on any per-engine template (analytics-clickhouse-keeper-
# node, analytics-clickhouse-server-node, analytics-starrocks-fe-node,
# analytics-starrocks-be-node).
#
# Ported from nexus-infra-oltp's oltp_firstboot at Phase 0.G.5 scaffold. The
# firstboot script (files/analytics-node-firstboot.sh) is role-agnostic: it does
# NIC discovery + IP->hostname mapping across ALL analytics-tier IPs (ClickHouse
# .41-.49, StarRocks .31-.36) and self-selects the role from its own DHCP IP.
# Inert IPs on a given clone just don't match + get skipped.
#
# The systemd unit gates on the firstboot done-marker so the script runs exactly
# once per clone.

- name: Install analytics-node-firstboot.sh
  ansible.builtin.copy:
    src: analytics-node-firstboot.sh
    dest: /usr/local/sbin/analytics-node-firstboot.sh
    owner: root
    group: root
    mode: '0755'

- name: Install analytics-node-firstboot.service systemd unit
  ansible.builtin.template:
    src: analytics-node-firstboot.service.j2
    dest: /etc/systemd/system/analytics-node-firstboot.service
    owner: root
    group: root
    mode: '0644'

- name: Enable analytics-node-firstboot.service (runs once on first clone boot)
  ansible.builtin.systemd:
    name: analytics-node-firstboot.service
    enabled: true
    daemon_reload: true
