#!/usr/sbin/nft -f
#
# analytics-starrocks-fe-node -- nftables ruleset (Phase 0.G.6 baseline;
# cold-clone safety net). The TF role-overlay-starrocks-nftables-backplane.tf
# is the canonical source of truth.
#
# nic0 = VMnet11 (service: MySQL 9030 + HTTP 8030), nic1 = VMnet10 (backplane:
# FE edit_log 9010 + rpc 9020 + FE<->BE). Per memory/feedback_cluster_template_
# nftables_backplane.md the VMnet10 trust rule is what makes the FE quorum +
# FE<->BE traffic work.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane (FE edit_log 9010 + rpc 9020 +
        # FE<->BE thrift/brpc/heartbeat). Whole-segment trust is canonical.
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Client / operator / smoke access from the lab (VMnet11):
        #   9030  StarRocks MySQL query protocol (clients via round-robin DNS)
        #   8030  StarRocks FE HTTP (REST/admin)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport { 9030, 8030 } accept comment "StarRocks FE MySQL + HTTP from VMnet11"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
