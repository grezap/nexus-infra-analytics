#!/usr/sbin/nft -f
#
# analytics-clickhouse-keeper-node -- nftables ruleset (Phase 0.G.5 baseline;
# cold-clone safety net).
#
# Builds on the deb13 baseline (deny-all-inbound, allow SSH + node_exporter
# from VMnet11) and adds the ClickHouse Keeper role's cluster-backplane +
# operator-access rules.
#
# At clone time nic0 = VMnet11 (service), nic1 = VMnet10 (cluster backplane),
# set up by analytics-node-firstboot.sh post-clone.
#
# Kept in sync with terraform/envs/analytics-clickhouse/role-overlay-clickhouse-
# nftables-backplane.tf, which pushes its OWN inlined ruleset + `nft -f` at apply
# time (the canonical source of truth). This baked baseline only matters for a
# clone whose Terraform apply never ran.
#
# Per memory/feedback_cluster_template_nftables_backplane.md: the
# `iifname "nic1" ip saddr 192.168.10.0/24 accept` rule is what makes the Keeper
# RAFT quorum (9234) + the server->keeper client traffic (9181) work over the
# backplane; without it ping passes but TCP does not.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop

        # ICMP -- let everything ping (debug-friendly in a lab)
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        # Management from the lab network only
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane. ClickHouse Keeper carries its
        # client port (9181) + RAFT inter-server port (9234) on the backplane;
        # the clickhouse-server data nodes reach Keeper over VMnet10. Whole-
        # segment trust is the canonical cluster-backplane pattern; nic1 only
        # carries 192.168.10.0/24, and the saddr restriction prevents cross-
        # network leak via misconfigured routing.
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Operator / smoke-gate access from the build host / lab (VMnet11):
        #   9181  ClickHouse Keeper client port (mntr 4-letter-word probes)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9181 accept comment "ClickHouse Keeper client from VMnet11"

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
