---
# analytics_clickhouse_keeper role -- install ClickHouse Keeper (vendor apt),
# the systemd unit (DISABLED -- the Terraform keeper-config overlay renders
# keeper_config.xml + enables it per-host), and the per-node dirs. Runs after
# the four shared nexus_* roles + analytics_firstboot inside the Packer template.
#
# ClickHouse Keeper is the dedicated C++ RAFT coordinator (NOT ZooKeeper --
# ADR-0028). Three of these clone into the keeper quorum (ch-keeper-1..3).

# ─── ClickHouse vendor apt repo ──────────────────────────────────────────
- name: Fetch ClickHouse repo GPG key (ASCII-armored, over HTTPS)
  ansible.builtin.get_url:
    url: "{{ analytics_ch_repo_key_url }}"
    dest: /tmp/clickhouse-key.asc
    mode: "0644"

- name: Install ClickHouse repo keyring (dearmored)
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ analytics_ch_repo_keyring }} /tmp/clickhouse-key.asc"
    creates: "{{ analytics_ch_repo_keyring }}"

- name: Ensure keyring is world-readable
  ansible.builtin.file:
    path: "{{ analytics_ch_repo_keyring }}"
    mode: "0644"
    owner: root
    group: root

- name: Add ClickHouse apt repo
  ansible.builtin.apt_repository:
    repo: "{{ analytics_ch_repo_line }}"
    filename: clickhouse
    state: present
    update_cache: true

# ─── ClickHouse Keeper install ───────────────────────────────────────────
- name: Install clickhouse-keeper (vendor apt)
  ansible.builtin.apt:
    name: "{{ 'clickhouse-keeper' if analytics_clickhouse_version == 'latest' else 'clickhouse-keeper=' + analytics_clickhouse_version }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Disable + mask the apt-shipped clickhouse-keeper.service ─────────────
# Our canonical unit is nexus-clickhouse-keeper.service which reads
# /etc/nexus-clickhouse-keeper/keeper_config.xml (rendered by Terraform with
# the per-host server_id). Leaving the apt unit enabled would race ours on
# 9181/9234. Mask survives a later `systemctl enable`.
- name: Stop clickhouse-keeper.service (apt-installed) if running
  ansible.builtin.systemd:
    name: clickhouse-keeper.service
    state: stopped
  failed_when: false

- name: Disable + mask clickhouse-keeper.service (apt-installed)
  ansible.builtin.systemd:
    name: clickhouse-keeper.service
    enabled: false
    masked: true

# ─── ClickHouse system account (package creates it; verify only) ──────────
- name: Verify clickhouse group exists (package-created)
  ansible.builtin.getent:
    database: group
    key: "{{ analytics_ch_group }}"

- name: Verify clickhouse user exists (package-created)
  ansible.builtin.getent:
    database: passwd
    key: "{{ analytics_ch_user }}"

# ─── Per-node config + data + log dirs ────────────────────────────────────
# config dir is root:clickhouse 0750 -- Terraform overlays write here as root,
# nexus-clickhouse-keeper.service reads as clickhouse. firstboot writes
# node-identity.env here too.
- name: Create nexus-clickhouse-keeper directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ analytics_keeper_config_dir }}", owner: root, group: "{{ analytics_ch_group }}", mode: "0750" }
    - { path: "{{ analytics_keeper_config_dir }}/tls", owner: root, group: "{{ analytics_ch_group }}", mode: "0750" }
    - { path: "{{ analytics_keeper_data_dir }}", owner: "{{ analytics_ch_user }}", group: "{{ analytics_ch_group }}", mode: "0750" }
    - { path: "{{ analytics_keeper_log_dir }}", owner: "{{ analytics_ch_user }}", group: "{{ analytics_ch_group }}", mode: "0750" }

# ─── nexus-clickhouse-keeper.service (DISABLED at bake) ───────────────────
- name: Install nexus-clickhouse-keeper.service systemd unit
  ansible.builtin.template:
    src: nexus-clickhouse-keeper.service.j2
    dest: /etc/systemd/system/nexus-clickhouse-keeper.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure nexus-clickhouse-keeper.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-clickhouse-keeper.service
    enabled: false
    daemon_reload: true

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify ClickHouse Keeper binary
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - "sh -c '/usr/bin/clickhouse-keeper --version || /usr/bin/clickhouse keeper --version'"
  register: analytics_keeper_verify

- name: Show installed ClickHouse Keeper version
  ansible.builtin.debug:
    msg:
      - "ClickHouse Keeper: {{ analytics_keeper_verify.results[0].stdout }}"
      - "Source:            {{ analytics_clickhouse_version }}"
